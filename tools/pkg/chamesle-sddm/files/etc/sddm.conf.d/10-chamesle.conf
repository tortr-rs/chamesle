[Theme]
Current=chamesle
CursorTheme=Adwaita

[Users]
# real people only, and their pictures when they set one
MinimumUid=1000
MaximumUid=60000
RememberLastUser=true
RememberLastSession=true

[X11]
# sddm's setup, and the sign-in screen said out loud when the screen reader was picked at install
DisplayCommand=/usr/lib/chamesle/sddm-setup
